# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Build environment (required by Read the Docs since 2023 - builds fail without build.os)
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation with Sphinx
sphinx:
  configuration: doc_source/conf.py

# Optionally build your docs in additional formats such as PDF
formats:
  - pdf

# Requirements needed to build the docs (autodoc imports awsimple, so its runtime dependencies are included)
python:
  install:
    - requirements: doc_source/requirements.txt
