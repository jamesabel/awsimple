# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the tokenless Codecov upload
    strategy:
      matrix:
        # Policy: test the minimum supported version, the latest fully released version and the upcoming pre-release
        # (as of 2026-11: 3.12, 3.15 and 3.16). This job needs all of requirements-dev.txt, which does not install
        # from wheels on 3.15 or 3.16 (and must never be built from source): PyYAML (needed by moto and awscli) has no
        # cp315 or cp316 wheel, and Pillow has no cp316 wheel. So this matrix is the minimum (3.12) up to the newest
        # version the full dependency set installs on (3.14), and 3.15 is tested by the build-moto-server job below.
        # 3.16 is not tested yet (no Pillow wheel). Move a version up into this matrix once this passes for it:
        #   uv pip compile requirements-dev.txt --python-version 3.15 --python-platform linux --only-binary :all:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true   # enable pre-release versions, e.g. 3.14.0bX

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --pre pytest   # allow pytest pre-releases too
        pip install flake8
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    # was for pytest-fly, but couldn't get CI to install a compatible libEGL
    # - name: Install libEGL dependency
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libegl-mesa0 libgl1

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest -s --cov=awsimple --cov-report=xml test_awsimple

    # Tokenless (OIDC) upload, so no CODECOV_TOKEN secret is needed. A pull request from a fork gets no OIDC token,
    # so the upload is skipped there; coverage for it is reported once it is merged.
    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: coverage.xml
        disable_search: true   # upload only coverage.xml (the search also picks up doc_source/coverage.txt)
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: true

  # Tests on Python versions where moto can not be installed from wheels (see the policy comment above). moto runs
  # as a server in a separate Python environment (a version it does install on) and awsimple talks to it over HTTP in
  # its LocalStack mode (the moto server listens on the LocalStack port). The test environment therefore needs only
  # requirements-test-moto-server.txt. This is slower than the in-process mock because the tests use real waits.
  build-moto-server:

    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.15"]
    env:
      AWSIMPLE_USE_LOCALSTACK: "1"
      AWSIMPLE_USE_MOTO_MOCK: "0"
      # belt and braces: send every boto3 client to the moto server and never use real credentials. The fake keys have
      # the length of real ones (test_get_access_key checks that).
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: AAAAAAAAAAAAAAAAAAAA
      AWS_SECRET_ACCESS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AWS_DEFAULT_REGION: us-west-2

    steps:
    - uses: actions/checkout@v4

    # The moto server's own Python: the newest version requirements-moto-server.txt installs on from wheels. The
    # stock motoserver/moto container image is not used because it lacks awscrt, which moto needs to compute
    # CRC64NVME checksums (without it, multipart uploads get a wrong full-object checksum).
    - name: Set up Python 3.14 for the moto server
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install and start the moto server
      run: |
        python -m venv "$RUNNER_TEMP/moto-server"
        "$RUNNER_TEMP/moto-server/bin/pip" install --only-binary :all: -r requirements-moto-server.txt
        nohup "$RUNNER_TEMP/moto-server/bin/moto_server" -H 127.0.0.1 -p 4566 > "$RUNNER_TEMP/moto-server.log" 2>&1 &
        curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused --output /dev/null http://localhost:4566/moto-api/

    # set up after the moto server's Python, so this is the "python" the remaining steps use
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies (wheels only)
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary :all: -r requirements-test-moto-server.txt

    - name: Create the AWS profiles and buckets the tests expect
      # - conftest.py only creates the profiles in mock mode
      # - the testawsimple bucket exists up front, as it does on real AWS (in mock mode awsimple creates it)
      # - a bucket called "google" is owned by another account, as on real AWS (test_s3_bucket_owned_by_someone_else)
      run: |
        mkdir -p ~/.aws
        printf '%s\n' '[default]' "aws_access_key_id=$AWS_ACCESS_KEY_ID" "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY" '[testawsimple]' "aws_access_key_id=$AWS_ACCESS_KEY_ID" "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
        printf '%s\n' '[default]' 'region=us-west-2' '[profile testawsimple]' 'region=us-west-2' > ~/.aws/config
        curl --silent --fail --output /dev/null -X PUT --data '<CreateBucketConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><LocationConstraint>us-west-2</LocationConstraint></CreateBucketConfiguration>' http://localhost:4566/testawsimple
        curl --silent --fail --output /dev/null -X PUT -H 'x-moto-account-id: 111111111111' http://localhost:4566/google

    - name: Test with pytest
      run: |
        python --version
        pytest -s test_awsimple

    - name: Show the moto server log
      if: failure()
      run: tail -n 200 "$RUNNER_TEMP/moto-server.log"
