# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the tokenless Codecov upload
    strategy:
      matrix:
        # Policy: test the minimum supported version, the latest fully released version and the upcoming pre-release
        # (as of 2026-11: 3.12, 3.15 and 3.16). 3.15 and 3.16 are not in the matrix yet because the dev dependencies
        # do not all ship wheels for them and must never be built from source: PyYAML (needed by moto and awscli)
        # has no cp315 or cp316 wheel, and Pillow has no cp316 wheel. Until they do, the matrix is the minimum (3.12)
        # up to the newest version the full dependency set installs on from wheels (3.14). Re-check with:
        #   uv pip compile requirements-dev.txt --python-version 3.15 --python-platform linux --only-binary :all:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true   # enable pre-release versions, e.g. 3.14.0bX

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --pre pytest   # allow pytest pre-releases too
        pip install flake8
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    # was for pytest-fly, but couldn't get CI to install a compatible libEGL
    # - name: Install libEGL dependency
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libegl-mesa0 libgl1

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        pytest -s --cov=awsimple --cov-report=xml test_awsimple

    # Tokenless (OIDC) upload, so no CODECOV_TOKEN secret is needed. A pull request from a fork gets no OIDC token,
    # so the upload is skipped there; coverage for it is reported once it is merged.
    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: coverage.xml
        disable_search: true   # upload only coverage.xml (the search also picks up doc_source/coverage.txt)
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: true
