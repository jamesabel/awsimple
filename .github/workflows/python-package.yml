# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the tokenless Codecov upload
    strategy:
      matrix:
        # Policy: test the minimum supported version, the latest fully released version and the upcoming pre-release
        # (as of 2026-11: 3.12, 3.15 and 3.16), plus the versions in between. Keep in sync with envlist in tox.ini.
        # 3.15: PyYAML (needed by moto and awscli) has no cp315 wheel, so it is built from source here. That works
        # on this Linux runner with no extra setup; on Windows its C extension needs MSVC, so make_venv_dev.bat and
        # tox.ini set PYYAML_FORCE_LIBYAML=0 to build the pure Python version. Revisit when PyYAML ships a cp315 wheel.
        # 3.16: not tested yet - PyYAML and Pillow have no cp316 wheel. Check which packages lack wheels with:
        #   uv pip compile pyproject.toml --group dev --python-version 3.16 --python-platform linux --only-binary :all:
        # 3.14t: free-threaded Python (no GIL). test_free_threading.py checks that the GIL stays off with everything awsimple imports.
        # 3.15t: not tested yet - boto3[crt] pins an awscrt version that has no free-threaded 3.15 wheel (newer awscrt versions have one).
        python-version: ["3.12", "3.13", "3.14", "3.15", "3.14t"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: false

    # awsimple, its dependencies and the dev group in pyproject.toml. There is no uv.lock, so these are the newest versions.
    - name: Install dependencies
      run: uv sync --upgrade

    # was for pytest-fly, but couldn't get CI to install a compatible libEGL
    # - name: Install libEGL dependency
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libegl-mesa0 libgl1

    # the rules are in pyproject.toml. Any finding fails the build.
    - name: Lint with ruff
      run: uv run ruff check .

    - name: Check formatting with ruff
      run: uv run ruff format --check .

    - name: Type check with ty
      run: uv run ty check awsimple

    - name: Test with pytest
      run: |
        uv run pytest -s --cov=awsimple --cov-report=xml test_awsimple

    # Tokenless (OIDC) upload, so no CODECOV_TOKEN secret is needed. A pull request from a fork gets no OIDC token,
    # so the upload is skipped there; coverage for it is reported once it is merged.
    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        files: coverage.xml
        disable_search: true   # upload only coverage.xml (the search also picks up doc_source/coverage.txt)
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: true
