# Builds the Sphinx documentation and publishes it to GitHub Pages (https://jamesabel.github.io/awsimple/).
#
# The docs are built on every pull request, so a change that breaks them fails the PR. They are deployed only from main.
# GitHub Pages must be set to "Source: GitHub Actions" in the repository settings.

name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; let an in-progress deployment finish
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc_source/requirements.txt

      - name: Build docs
        # -W: warnings are errors, so e.g. a module autodoc can not import fails the build
        run: sphinx-build -b html -W --keep-going doc_source build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
