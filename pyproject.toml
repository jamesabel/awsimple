[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awsimple"
dynamic = ["version"]  # read from awsimple/__version__.py, see [tool.hatch.version]
description = "Simple AWS API for S3, DynamoDB, SNS, and SQS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "abel", email = "j@abel.co" }]
keywords = ["aws", "cloud", "storage", "database", "dynamodb", "s3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Typing :: Typed",
]
dependencies = [
    "boto3[crt]>=1.43.0",  # >=1.43.0 for CRC64NVME checksum support
    "typeguard",
    "hashy>=0.14.0",  # >=0.14.0 for CRC64NVME checksum support
    "dictim",
    "appdirs",
    "tobool",
    "urllib3",
    "python-dateutil",
    "yasf",
    "strif",
]

[project.urls]
Homepage = "https://github.com/jamesabel/awsimple"
Documentation = "https://jamesabel.github.io/awsimple/"
Download = "https://github.com/jamesabel/awsimple"

# Development environments are made with uv ("uv sync" installs awsimple, its dependencies and the dev group).
# No uv.lock is committed (it is git-ignored), so CI, tox and a new environment install the newest versions allowed here.
[dependency-groups]
dev = [
    # examples
    "ismain",
    # packaging (test_package_metadata.py reads the metadata with hatchling)
    "hatchling",
    # testing
    "pytest",
    # Not the "dynamodb" extra of moto: it adds docker, which nothing here uses and which can not be installed on
    # free-threaded Python on Windows (it needs pywin32). The other thing that extra adds (py-partiql-parser) comes with the "s3" extra.
    "moto[s3,sns,sqs]",
    "awscli",
    "coverage",
    "pytest-cov",
    "pytest-pycharm",
    "pytest-socket",
    "pytest-xdist",
    "tox",
    "tox-uv",
    "pre-commit",
    "pillow",
    "requests",
    # formatting, linting and type checking
    "ruff",
    "ty>=0.0.106",  # ty is pre-1.0, so its rules can change between releases: this is the version the code was last checked with
    "boto3-stubs[s3,dynamodb,sqs,sns]",
    "appdirs-stubs",
    "types-urllib3",
    "types-Pillow",
    "types-python-dateutil",
    # documentation
    { include-group = "docs" },
]
docs = ["sphinx"]

[tool.hatch.version]
# parsed from the file as text, so building does not import the package (or need its dependencies)
path = "awsimple/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["awsimple"]

[tool.hatch.build.targets.sdist]
include = ["/awsimple", "/README.md", "/LICENSE"]

[tool.ruff]
line-length = 192

[tool.ruff.lint]
# E and W: pycodestyle, F: pyflakes, C90: mccabe complexity
select = ["E", "F", "W", "C90"]

[tool.ruff.lint.mccabe]
# functions that were over the limit when it was first enforced are marked "noqa: C901"
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# these import names in order to re-export them
"awsimple/__init__.py" = ["F401"]
"test_awsimple/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# only collect the test suite - the examples directory contains scripts (e.g. aws_access_test.py) that match
# pytest's *_test.py pattern and hit real AWS at import time
testpaths = ["test_awsimple"]
