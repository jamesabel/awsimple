# Runs the test suite on every supported Python version. Used by the pre-commit hook (.pre-commit-config.yaml) and
# runnable directly with "uv run tox" (all versions) or e.g. "uv run tox -e py315" (one version).

[tox]
# the environments are made with uv, which also provides any of the Python versions that are not installed
requires = tox-uv
# Policy: test the minimum supported version, the latest fully released version and the upcoming pre-release, plus
# the versions in between. Keep in sync with the matrix in .github/workflows/python-package.yml (a test checks this).
# py314t is free-threaded Python (no GIL). See [testenv:py314t] for where it runs, and the workflow for why there is no py315t yet.
envlist = py312, py313, py314, py315, py314t

[testenv]
# awsimple is installed in editable mode, so it is tested from the source tree, as in CI
package = editable
# the dev group in pyproject.toml
dependency_groups = dev
# the tests name some resources after the current user (getpass.getuser() reads these)
passenv =
    USERNAME
    USER
    LOGNAME
setenv =
    # always the moto mock, never real AWS or LocalStack, whatever is set in the calling shell
    AWSIMPLE_USE_MOTO_MOCK = 1
    AWSIMPLE_USE_LOCALSTACK = 0
    # PyYAML has no Python 3.15 wheel yet, so it is built from source there. Its optional C extension needs a
    # compiler (MSVC on Windows), so build the pure Python version. Has no effect where a wheel is installed.
    PYYAML_FORCE_LIBYAML = 0
commands = pytest test_awsimple {posargs}

[testenv:py314t]
# Free-threaded Python is tested on Linux and macOS (and in CI) only: on Windows the dev group can not be installed, since pywin32 (needed by docker, which
# moto[dynamodb] needs) has no free-threaded wheel. awsimple itself installs and runs on free-threaded Python on Windows. Revisit when pywin32 has one.
platform = linux|darwin
